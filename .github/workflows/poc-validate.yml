name: PoC — self-liquidation validation

on:
  workflow_dispatch: {}
  push:
    branches: [ main, "**" ]

jobs:
  poc-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install Solana CLI (required for SBF build)
        run: |
          set -euo pipefail
          SOL_VER=2.3.0
          echo "Installing Solana $SOL_VER (with retries)"
          for i in 1 2 3 4 5; do
            if curl -sSfL "https://release.solana.com/${SOL_VER}/install" | sh; then
              echo "solana installer succeeded"
              break
            else
              echo "solana installer failed (attempt ${i}), retrying in 5s..."
              sleep 5
            fi
          done
          # Persist solana into subsequent steps
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version || true

      - name: Install Anchor CLI
        run: |
          cargo install anchor-cli --locked --version 0.32.0
          anchor --version

      - name: CI diagnostics
        run: |
          echo "--- PATH ---";
          echo "$PATH";
          echo "--- which / versions ---";
          which rustc || true; rustc --version || true;
          which cargo || true; cargo --version || true;
          which solana || true; solana --version || true;
          which anchor || true; anchor --version || true;
          echo "--- ensure cargo/solana in future steps ---";
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH || true;
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH || true;
          ls -la "$HOME/.local/share/solana/install/active_release/bin" || true;
          env | sort

      - name: Vulnerable run — remove mitigation and build
        run: |
          # Temporarily remove the signer==recipient guard to demonstrate PoC
          python3 .github/scripts/remove_mitigation.py

      - name: anchor build (vulnerable)
        run: |
          anchor build --skip-lint

      - name: Upload vulnerable SBF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbf-artifacts-vulnerable
          path: target/deploy/*.so

      - name: Run PoC test (vulnerable)
        run: |
          cargo test -p tests --features poc_self_liquidation poc_test_self_liquidation_captures_bonus_positive -- --nocapture

      - name: Restore mitigation and rebuild
        run: |
          git checkout -- programs/vaults/src/utils/validate.rs || true
          anchor build --skip-lint

      - name: Upload fixed SBF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbf-artifacts-fixed
          path: target/deploy/*.so

      - name: Run regression test (fixed)
        run: |
          cargo test -p tests test_self_liquidation_captures_bonus_positive -- --nocapture
