name: PoC — self-liquidation validation

on:
  workflow_dispatch: {}
  push:
    branches: [ main, "**" ]

jobs:
  poc-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install Solana CLI (required for SBF build)
        run: |
          curl -sSfL https://release.solana.com/2.3.0/install | sh
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor CLI
        run: |
          cargo install anchor-cli --locked --version 0.32.0
          anchor --version

      - name: Vulnerable run — remove mitigation and build
        run: |
          # Temporarily remove the signer==recipient guard to demonstrate PoC
          python3 - <<'PY'
from pathlib import Path
p = Path('programs/vaults/src/utils/validate.rs')
s = p.read_text()
old_block = (
    "    // Prevent obvious self-liquidation vector where signer == recipient.\n"
    "    // NOTE: this is a defensive mitigation — owners should not be able to liquidate\n"
    "    // their own positions and capture the liquidation premium. A follow-up\n"
    "    // hardening should validate position ownership during liquidation.\n"
    "    if ctx.accounts.signer.key() == ctx.accounts.to.key() {\n"
    "        return Err(error!(ErrorCodes::VaultSelfLiquidationNotAllowed));\n"
    "    }\n"
)
if old_block in s:
    s = s.replace(old_block, "    // guard removed for PoC run in CI\n")
    p.write_text(s)
    print('mitigation-removed')
else:
    print('mitigation-block-not-found')
PY

      - name: anchor build (vulnerable)
        run: |
          anchor build --skip-lint

      - name: Run PoC test (vulnerable)
        run: |
          cargo test -p tests --features poc_self_liquidation poc_test_self_liquidation_captures_bonus_positive -- --nocapture

      - name: Restore mitigation and rebuild
        run: |
          git checkout -- programs/vaults/src/utils/validate.rs || true
          anchor build --skip-lint

      - name: Run regression test (fixed)
        run: |
          cargo test -p tests test_self_liquidation_captures_bonus_positive -- --nocapture
